<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduAdapt Admin - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-box">
      <div class="mark">E</div>
      <h2>EduAdapt Admin</h2>
      <p style="margin-top:2px; margin-bottom:0;">Sign in to manage your school.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@school.test">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">

        <button type="submit" style="width:100%;">Log In</button>
      </form>
      <div id="message"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      messageEl.textContent = '';
      messageEl.className = '';

      try {
        const data = await apiRequest('/admin/login', 'POST', { email, password });
        setToken(data.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'error';
      }
    });
  </script>
</body>
</html>
